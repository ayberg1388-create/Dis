<title>Учёт AyBerg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone ledger, sticky header with company chips, tabs, bottom-sheet form */
:root{
  --bg:#000000; --surface:#0c0c0c; --ink:#e9e9e9; --muted:#ff9f1c; --line:#2b2b2b;
  --accent:#ff9f1c; --accent-ink:#000000; --in:#38e07b; --out:#ff4b4b; --warn:#ffd23f;
  --font:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:13.5px/1.4 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--accent);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;margin-inline:-2px;padding-inline:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.status{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.csv{border:1px solid var(--line);background:var(--surface);border-radius:0;padding:8px 12px;font-size:13px;font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:0;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.proj{margin:10px 0 0}
.seg.proj button{font-size:15px}
.est{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:0}
.est table{border-collapse:collapse;font-size:12.5px;min-width:560px;width:100%}
.est th,.est td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.est th:first-child,.est td:first-child{text-align:left;white-space:normal;min-width:170px}
.est th{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.est tfoot td{font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);margin-top:6px}
.tab{text-transform:uppercase;letter-spacing:.05em;font-size:12px;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pie svg{width:180px;height:180px;flex:none}
.legend{flex:1;min-width:200px;display:grid;gap:6px}
.lg{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:12px}
.lg i{width:12px;height:12px}
.lg .amt{color:var(--muted);min-width:84px;text-align:right}
.pot{margin:14px 0 0}
.bal{font-size:13px;color:var(--muted);margin-top:6px}
.bal b{font-family:var(--mono)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:14px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:10px;min-width:0}
.sum small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sum b{display:block;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.in{color:var(--in)} .out{color:var(--out)}
.day{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:0;overflow:hidden}
.row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .t{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .a{font-size:14px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:0;padding:0 5px;margin-right:4px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:0;margin-top:16px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.co{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:12px;margin-bottom:10px}
.co h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding-block:3px}
.kv span:first-child{color:var(--muted);text-transform:uppercase;font-size:11.5px;letter-spacing:.03em}
.fabs{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.fabs .fab{position:static}
.fab.cam{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.shot{display:block;max-width:100%;max-height:150px;margin:0 auto 10px;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--warn);margin-bottom:8px}
.fab{text-transform:uppercase;letter-spacing:.05em;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:0;padding:14px 20px;font-weight:600;z-index:6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:17px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:0;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:none;padding:10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:0;padding:11px 10px;font-size:16px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;margin-top:16px}
.act button{flex:1;border-radius:0;padding:13px;font-weight:600;border:1px solid var(--line);background:none}
.act .ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act .del{color:var(--out);flex:none;padding-inline:16px}
.err{color:var(--out);font-size:13px;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:0;font-size:13px;z-index:30}
</style>

<header>
  <div class="top">
    <div><h1>Учёт AyBerg · АҚ СҰЛТАН</h1><div class="status" id="status">Загрузка…</div></div>
    <button class="csv" id="csv" hidden>Скачать CSV</button>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div class="seg proj" id="projects"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main id="main"></main>
<div class="fabs"><button class="fab cam" id="photo">Фото чека</button><button class="fab" id="add">+ Добавить</button></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script>
const COMPANIES=['АҚ СҰЛТАН'];
const PROJECTS=['БОК','Нац банк'];
const EST_BOK={"date": "12.06.2026", "title": "БОК «Омарова» — монолитные работы", "rows": [["Срубка оголовок свай", "шт", 452, 1500, 678000, 1300, 587600, 93517.24, 584482.76, -3117.24, 58448.28, -61565.52], ["Щебеночная подготовка с трамбовкой", "м3", 102.78, 3500, 359730, 0, 0, 49617.93, 310112.07, 310112.07, 31011.21, 279100.86], ["Бетонная подготовка", "м2", 991, 5000, 4955000, 1000, 991000, 683448.28, 4271551.72, 3280551.72, 427155.17, 2853396.55], ["Вертикальная обмазочная гидроизоляция в 2 слоя", "м2", 1001.2, 500, 500600, 0, 0, 69048.28, 431551.72, 431551.72, 43155.17, 388396.55], ["Фундаменты (стаканы, лента)", "м3", 184.26, 29000, 5343540, 17000, 3132420, 737040, 4606500, 1474080, 460650.0, 1013430.0], ["Фундаменты (плита)", "м3", 619.91, 28000, 17357480, 8500, 5269235, 2394135.17, 14963344.83, 9694109.83, 1496334.48, 8197775.34], ["Вертикальная конструкция (ДЖМ, СТМ, Лшм) высотой до 3-х", "м3", 152.92, 50000, 7646000.0, 24000, 3670080.0, 1054620.69, 6591379.31, 2921299.31, 659137.93, 2262161.38], ["Вертикальная конструкция (ДЖМ, СТМ, Лшм) высотой выше 3- х метров", "м3", 491.31, 49000, 24074190, 24000, 11791440, 3320577.93, 20753612.07, 8962172.07, 2075361.21, 6886810.86], ["Плиты перекрытья без ригеля (Бм)- высотой до 3-х метров", "м3", 40.52, 50000, 2026000.0, 24000, 972480.0, 279448.28, 1746551.72, 774071.72, 174655.17, 599416.55], ["Плиты перекрытья с ригеля (Бм)- от до 3-х метров до 5 метров", "м3", 1921, 52000, 99892000, 24000, 46104000, 13778206.9, 86113793.1, 40009793.1, 8611379.31, 31398413.79], ["подбетонка пола", "м2", 1000, 5000, 5000000, 250, 250000, 689655.17, 4310344.83, 4060344.83, 431034.48, 3629310.34], ["полы", "м3", 152, 30000, 4560000, 8500, 1292000, 628965.52, 3931034.48, 2639034.48, 393103.45, 2245931.03], ["Входные группы, монолитная лестница", "м3", 87.05, 50000, 4352500, 24000, 2089200, 600344.83, 3752155.17, 1662955.17, 375215.52, 1287739.66]]};
const EST_NB={title:'Кассовый центр НБ РК · блоки 6 и 8',vat:0.16,tax:0.1,
  rows:[['Блок 6','Ростверк',1873.9,20000,8500],['Блок 6','Подготовка',271.4,5000,0],['Блок 6','Колонны',209.45,51000,27000],['Блок 6','Стены',77.2,51000,27000],['Блок 6','Плиты перекрытия',628.77,51000,27000],
  ['Блок 8','Ростверк',389.27,20000,8500],['Блок 8','Подготовка',76.18,5000,0],['Блок 8','Колонны',21.9,51000,27000],['Блок 8','Стены',3.15,51000,27000],['Блок 8','Плиты перекрытия',140.79,51000,27000]]};
function nbTotals(){const E=EST_NB,gross=E.rows.reduce((a,r)=>a+r[2]*r[3],0),net=gross/(1+E.vat),brig=E.rows.reduce((a,r)=>a+r[2]*r[4],0),diff=net-brig,tax=diff*E.tax;
  return{net,vat:gross-net,gross,brig,diff,tax,prof:diff-tax,margin:net?(diff-tax)/net:0}}
const CATS=['ПНСВ','Откат','Оборудование','Материалы','Зарплата','Налоги','Транспорт','Аренда','Услуги','Прочее'];
const DOCS=['Чек','Акт','Счёт-фактура','Прочее'];
const TABS=[['ops','Операции'],['acts','Акты'],['plan','План'],['calc','Расчёт']];
let savedP='';try{savedP=localStorage.getItem('project')||''}catch(e){}
const S={plans:[],settings:{},entries:[],project:PROJECTS.includes(savedP)?savedP:PROJECTS[0],company:'Все',tab:'ops',sheet:null,loaded:false,db:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₸';
const fmt0=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayLabel=d=>{try{return new Date(d+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

function filtered(){
  let l=S.entries.filter(e=>(e.project||PROJECTS[0])===S.project);
  if(S.tab==='acts')l=l.filter(e=>e.docType==='Акт');
  return l.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
}
const potential=p=>p==='БОК'?EST_BOK.rows.reduce((a,r)=>a+r[11],0):p==='Нац банк'?nbTotals().prof:0;
function balance(p,skipId){const l=S.entries.filter(e=>(e.project||PROJECTS[0])===p&&e.id!==skipId),t=totals(l);return potential(p)+t.b}
const planned=p=>S.plans.filter(x=>(x.project||PROJECTS[0])===p).reduce((a,x)=>a+(+x.amount||0),0);
function advance(p){
  const st=S.settings[p];if(!st)return null;
  const acts=S.entries.filter(e=>(e.project||PROJECTS[0])===p&&e.docType==='Акт'&&e.kind==='income').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));
  let rem=+st.advance||0;const map={};
  acts.forEach(e=>{const w=Math.min(rem,(+e.amount||0)*(+st.pct||0)/100);map[e.id]=w;rem-=w});
  return{adv:+st.advance||0,pct:+st.pct||0,map,done:(+st.advance||0)-rem,rem};
}
function totals(l){let i=0,o=0;l.forEach(e=>{if(e.kind==='income')i+=+e.amount||0;else o+=+e.amount||0});return{i,o,b:i-o}}

function render(){
  $('projects').innerHTML=PROJECTS.map(p=>`<button type="button" data-proj="${esc(p)}" aria-pressed="${S.project===p}">${esc(p)}</button>`).join('');
  $('tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${n}</button>`).join('');
  const m=$('main');
  if(S.tab==='calc'){m.innerHTML=renderCalc();return}
  if(S.tab==='plan'){m.innerHTML=renderPlan();return}
  const l=filtered(),t=totals(l);
  const pot=potential(S.project);
  const A=advance(S.project);
  let h=(A?`<div class="co pot"><h3>Аванс · удержание ${A.pct}% с каждого акта</h3><div class="kv"><span>Получено аванса</span><b class="num">${fmt(A.adv)}</b></div><div class="kv"><span>Удержано с актов</span><span class="num out">${fmt(A.done)}</span></div><div class="kv"><span>Остаток аванса</span><b class="num ${A.rem>0?'out':'in'}">${fmt(A.rem)}</b></div></div>`:'')+(pot?`<div class="co pot"><div class="kv"><span>Потенциальная прибыль</span><b class="num in">${fmt(pot)}</b></div><div class="kv"><span>Баланс (прибыль − расходы)</span><b class="num ${balance(S.project)<0?'out':'in'}">${fmt(balance(S.project))}</b></div>${planned(S.project)?`<div class="kv"><span>Запланировано расходов</span><span class="num" style="color:var(--warn)">${fmt(planned(S.project))}</span></div><div class="kv"><span>Баланс после плана</span><b class="num ${balance(S.project)-planned(S.project)<0?'out':'in'}">${fmt(balance(S.project)-planned(S.project))}</b></div>`:''}</div>`:'')+`<div class="sum"><div><small>Приход</small><b class="num in">${fmt(t.i)}</b></div><div><small>Расход</small><b class="num out">${fmt(t.o)}</b></div><div><small>Баланс</small><b class="num ${t.b<0?'out':'in'}">${fmt(t.b)}</b></div></div>`;
  if(!l.length){
    h+=`<div class="empty"><b>${S.loaded?(S.tab==='acts'?'Актов пока нет':'Записей пока нет'):'Загрузка…'}</b>${S.loaded?'Нажмите «Добавить» или пришлите чек Claude в чат: он добавит запись сюда.':''}</div>`;
  }else{
    let last='',open=false;
    l.forEach(e=>{
      if(e.date!==last){if(open)h+='</div>';h+=`<div class="day">${dayLabel(e.date)}</div><div class="list">`;last=e.date;open=true}
      const sign=e.kind==='income'?'+':'−';
      h+=`<button class="row" data-id="${esc(e.id)}"><div class="l"><div class="t">${esc(e.party||e.category||'Без названия')}</div><div class="s"><span class="tag">${esc(e.docType||'Прочее')}</span>${esc(e.company)} · ${esc(e.category||'')}${e.note?' · '+esc(e.note):''}${A&&A.map[e.id]!==undefined?` · удержано ${fmt(A.map[e.id])}, к оплате ${fmt((+e.amount||0)-A.map[e.id])}`:''}</div></div><div class="a num ${e.kind==='income'?'in':'out'}">${sign}${fmt(+e.amount||0)}</div></button>`;
    });
    if(open)h+='</div>';
  }
  m.innerHTML=h;
}
const PIE_COLORS=['var(--accent)','var(--in)','var(--out)','var(--warn)','var(--ink)','var(--muted)','var(--line)'];
function pie(title,items,note){
  items=items.filter(i=>i[1]>0);const tot=items.reduce((a,i)=>a+i[1],0);if(!tot)return '';
  const R=84,r=50,c=100;let a0=-Math.PI/2,paths='';
  items.forEach((it,k)=>{
    const f=it[1]/tot,a1=a0+f*2*Math.PI,col=PIE_COLORS[k%PIE_COLORS.length];
    if(f>0.9999)paths+=`<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`;
    else{const x=(rad,a)=>(c+rad*Math.cos(a)).toFixed(2),y=(rad,a)=>(c+rad*Math.sin(a)).toFixed(2),big=f>0.5?1:0;
      paths+=`<path d="M${x(R,a0)} ${y(R,a0)} A${R} ${R} 0 ${big} 1 ${x(R,a1)} ${y(R,a1)} L${x(r,a1)} ${y(r,a1)} A${r} ${r} 0 ${big} 0 ${x(r,a0)} ${y(r,a0)}Z" fill="${col}" stroke="var(--bg)" stroke-width="1.5"/>`}
    a0=a1;
  });
  const leg=items.map((it,k)=>`<div class="lg"><i style="background:${PIE_COLORS[k%PIE_COLORS.length]}"></i><span>${esc(it[0])}</span><b class="num">${(it[1]/tot*100).toFixed(1)}%</b><span class="num amt">${fmt0(it[1])}</span></div>`).join('');
  return `<div class="co"><h3>${esc(title)}</h3><div class="pie"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(title)}">${paths}<text x="100" y="96" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="var(--mono)">ВСЕГО</text><text x="100" y="112" text-anchor="middle" fill="var(--ink)" font-size="11" font-family="var(--mono)">${fmt0(tot)}</text></svg><div class="legend">${leg}</div></div>${note?`<div class="status" style="margin-top:8px">${esc(note)}</div>`:''}</div>`;
}
function renderPlan(){
  const l=S.plans.filter(x=>(x.project||PROJECTS[0])===S.project).sort((a,b)=>(a.date||'').localeCompare(b.date||'')),pl=planned(S.project),t=totals(S.entries.filter(e=>(e.project||PROJECTS[0])===S.project)),bal=balance(S.project);
  let h=`<div class="co pot"><div class="kv"><span>Планируемые расходы</span><b class="num" style="color:var(--warn)">${fmt(pl)}</b></div><div class="kv"><span>Уже потрачено</span><span class="num out">${fmt(t.o)}</span></div><div class="kv"><span>Баланс сейчас</span><span class="num ${bal<0?'out':'in'}">${fmt(bal)}</span></div><div class="kv"><span>Баланс после плана</span><b class="num ${bal-pl<0?'out':'in'}">${fmt(bal-pl)}</b></div></div>`;
  if(!l.length)return h+`<div class="empty"><b>${S.loaded?'Планов пока нет':'Загрузка…'}</b>${S.loaded?'Нажмите «Добавить», чтобы записать будущий расход.':''}</div>`;
  h+='<div class="day">Запланировано</div><div class="list">';

function updBal(){
  const el=$('bal');if(!el)return;
  const a=parseFloat(($('f-amount').value||'').replace(/\s/g,'').replace(',','.'))||0,p=$('f-project').value;
  const b=balance(p,S.sheet.id)+(S.sheet.kind==='income'?a:-a);
  const st=S.settings[p];let hint='';
  if(st&&S.sheet.kind==='income'&&$('f-doc').value==='Акт'){
    const A=advance(p),others=A?A.done-(A.map[S.sheet.id]||0):0,w=Math.max(0,Math.min((+st.advance||0)-others,a*(+st.pct||0)/100));
    hint=`<br>Акт: удержание аванса ${st.pct}% = <b>${fmt(w)}</b>, к оплате <b>${fmt(a-w)}</b>`;
  }
  el.innerHTML=`Баланс ${esc(p)} после записи: <b class="${b<0?'out':'in'}">${fmt(b)}</b>`+(potential(p)?' (потенциальная прибыль − расходы)':'')+hint;
}

const SCAN_PROMPT=`На изображении чек, квитанция или перевод из Казахстана (валюта тенге ₸). Извлеки данные для записи расхода и верни ТОЛЬКО JSON без пояснений:
{"amount": число итоговой суммы в тенге без пробелов, "date": "YYYY-MM-DD" или null, "party": "магазин, продавец или получатель", "category": одна из ${JSON.stringify(CATS)}, "docType": одна из ${JSON.stringify(DOCS)}, "note": "что куплено, коротко"}
Если поле не видно, ставь null. Ничего не выдумывай.`;
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',0.5)}):rej(new Error('img')),'image/jpeg',0.8);URL.revokeObjectURL(u)};
  im.onerror=()=>rej(new Error('img'));im.src=u})}
async function scan(file){
  const btn=$('photo');btn.disabled=true;btn.textContent='Читаю чек…';
  const pre={_hint:''};
  try{
    const img=await shrink(file);pre._img=img.url;
    const sample=await claude.use('sample');
    if(!sample)pre._hint='Распознавание недоступно. Заполните поля вручную.';
    else{
      const r=await sample.json(SCAN_PROMPT,{images:[img.blob],modelTier:'quick',cache:false});
      const n=parseFloat(String(r.amount??'').replace(/\s/g,'').replace(',','.'));
      if(n>0)pre.amount=n;
      if(/^\d{4}-\d{2}-\d{2}$/.test(r.date||''))pre.date=r.date;
      if(r.party)pre.party=String(r.party);
      if(CATS.includes(r.category))pre.category=r.category;
      if(DOCS.includes(r.docType))pre.docType=r.docType;
      if(r.note)pre.note=String(r.note);
      pre._hint='Распознано по фото. Проверьте данные и нажмите «Сохранить».';
    }
  }catch(e){pre._hint=(e&&e.code==='not_granted')?'Нет разрешения на распознавание. Заполните поля вручную.':'Не удалось прочитать чек. Заполните поля вручную.'}
  btn.disabled=false;btn.textContent='Фото чека';
  openSheet(null,pre);
}

(async()=>{
  try{dl=await claude.use('downloads');if(dl)$('csv').hidden=false}catch(e){}
  try{S.db=await claude.use('db')}catch(e){}

  S.db.collection('settings').onSnapshot(snap=>{S.settings={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.project)S.settings[x.project]=x});if(!S.sheet)render()},()=>{});
  S.db.collection('plans').onSnapshot(snap=>{S.plans=snap.docs.map(d=>({id:d.id,...d.data()}));if(!S.sheet)render()},()=>{});
  S.db.collection('entries').onSnapshot(snap=>{
    S.entries=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;
    if(!S.sheet)render();
  },e=>{$('status').textContent='Нет доступа к данным';S.loaded=true;render()});
})();
